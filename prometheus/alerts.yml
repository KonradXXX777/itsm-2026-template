# ai-generated: 100% - Codex derived multiwindow burn alerts from the measured SLO.
groups:
  - name: svcdesk-slo
    rules:
      - alert: KbSearchErrorsBurnFast
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search",http_response_status_code=~"5.."}[1h])) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[1h])) > 14.4 * (1 - 0.99))
          and
          (sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search",http_response_status_code=~"5.."}[5m])) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[5m])) > 14.4 * (1 - 0.99))
        for: 5m
        labels: {service: svcdesk, slo: availability, severity: P1}
      - alert: KbSearchErrorsBurnSlow
        expr: |
          (sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search",http_response_status_code=~"5.."}[6h])) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[6h])) > 6 * (1 - 0.99))
          and
          (sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search",http_response_status_code=~"5.."}[30m])) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[30m])) > 6 * (1 - 0.99))
        for: 5m
        labels: {service: svcdesk, slo: availability, severity: P2}
      - alert: KbSearchLatencyBurnFast
        expr: |
          ((sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[1h])) - sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk",http_route="/kb/search",le="0.2"}[1h]))) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[1h])) > 14.4 * (1 - 0.99))
          and
          ((sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[5m])) - sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk",http_route="/kb/search",le="0.2"}[5m]))) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[5m])) > 14.4 * (1 - 0.99))
        for: 5m
        labels: {service: svcdesk, slo: latency, severity: P1}
      - alert: KbSearchLatencyBurnSlow
        expr: |
          ((sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[6h])) - sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk",http_route="/kb/search",le="0.2"}[6h]))) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[6h])) > 6 * (1 - 0.99))
          and
          ((sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[30m])) - sum(rate(http_server_request_duration_seconds_bucket{job="svcdesk",http_route="/kb/search",le="0.2"}[30m]))) / sum(rate(http_server_request_duration_seconds_count{job="svcdesk",http_route="/kb/search"}[30m])) > 6 * (1 - 0.99))
        for: 5m
        labels: {service: svcdesk, slo: latency, severity: P2}

